<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FOAM fire extinguisher illustration">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d1010"/>
      <stop offset="0.5" stop-color="#d62828"/>
      <stop offset="1" stop-color="#7d1010"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="#f4f6f8"/>
  <!-- hose -->
  <path d="M175 150 C 230 160, 245 190, 235 225" stroke="#1f2933" stroke-width="8" fill="none" stroke-linecap="round"/>
  <rect x="220" y="215" width="26" height="14" rx="3" fill="#1f2933"/>
  <!-- handle -->
  <rect x="118" y="55" width="64" height="14" rx="6" fill="#1f2933"/>
  <rect x="112" y="68" width="14" height="30" fill="#1f2933"/>
  <rect x="174" y="68" width="14" height="30" fill="#1f2933"/>
  <!-- trigger -->
  <path d="M126 95 q -18 10 -10 30" stroke="#1f2933" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="132" y="98" width="36" height="18" fill="#333d47"/>
  <!-- body -->
  <rect x="95" y="116" width="110" height="230" rx="26" fill="url(#bodyGrad)" stroke="#5c0d0d" stroke-width="2"/>
  <!-- band -->
  <rect x="95" y="205" width="110" height="46" fill="#0b5fa5"/>
  <text x="150" y="234" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">FOAM</text>
  <!-- base -->
  <rect x="85" y="340" width="130" height="20" rx="6" fill="#1f2933"/>
  <!-- highlight -->
  <rect x="106" y="130" width="14" height="190" rx="7" fill="#ffffff" opacity="0.18"/>
</svg>